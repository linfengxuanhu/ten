name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true

      - name: Flutter version
        run: flutter --version

      # 当前项目需要重新生成 Android 平台文件
      # 否则会出现 deleted Android v1 embedding 错误
      - name: Create Android platform files
        run: flutter create --platforms=android .

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release --no-shrink || BUILD_FAILED=$?

          echo ""
          echo "========================================"
          echo "       R8 MISSING RULES"
          echo "========================================"

          if [ -f build/app/outputs/mapping/release/missing_rules.txt ]; then
            echo ""
            echo "===== missing_rules.txt ====="
            cat build/app/outputs/mapping/release/missing_rules.txt
            echo ""
            echo "===== END missing_rules.txt ====="
          else
            echo "missing_rules.txt not found"
          fi

          echo ""
          echo "========================================"

          exit ${BUILD_FAILED:-0}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-council-apk
          path: build/app/outputs/flutter-apk/app-release.apk
