name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "stable"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android platform files
        run: flutter create --platforms=android .

      - name: Add R8 keep rules
        run: |
          mkdir -p android/app

          cat > android/app/proguard-rules.pro <<'EOF'
          # SnakeYAML optional JavaBean introspection classes
          -dontwarn java.beans.BeanInfo
          -dontwarn java.beans.FeatureDescriptor
          -dontwarn java.beans.IntrospectionException
          -dontwarn java.beans.Introspector
          -dontwarn java.beans.PropertyDescriptor
          EOF

          echo "===== R8 rules ====="
          cat android/app/proguard-rules.pro
          echo "===================="

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release --no-shrink || BUILD_FAILED=$?

          echo ""
          echo "========================================"
          echo "       R8 MISSING RULES"
          echo "========================================"

          if [ -f build/app/outputs/mapping/release/missing_rules.txt ]; then
            cat build/app/outputs/mapping/release/missing_rules.txt
          else
            echo "missing_rules.txt not found"
          fi

          echo "========================================"

          exit ${BUILD_FAILED:-0}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-council-apk
          path: build/app/outputs/flutter-apk/app-release.apk
